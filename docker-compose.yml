version: '3.8'

services:
  api:
    build: .
    container_name: fina-api
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: fina-db
    restart: always
    environment:
      POSTGRES_USER: fina_user
      POSTGRES_PASSWORD: fina_password
      POSTGRES_DB: fina_db
    ports:
      - "5433:5432"
    volumes:
      - fina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina_user -d fina_db"]
      interval: 5s
      retries: 5

volumes:
  fina_postgres_data: