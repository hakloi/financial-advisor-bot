services:
  frontend:
    build: ./frontend
    container_name: fina-frontend
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    container_name: fina-api
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: fina-worker
    command: celery -A backend.services.celery_app:celery_app worker --loglevel=info
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: fina-beat
    command: celery -A backend.services.celery_app:celery_app beat --loglevel=info
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: fina-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: fina-db
    restart: always
    environment:
      POSTGRES_USER: fina_user
      POSTGRES_PASSWORD: fina_password
      POSTGRES_DB: fina_db
    ports:
      - "5433:5432"
    volumes:
      - fina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fina_user -d fina_db"]
      interval: 5s
      retries: 5

volumes:
  fina_postgres_data: